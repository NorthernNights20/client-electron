<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Electron Godot Client</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', 'Oxygen', 'Ubuntu', 'Cantarell', 'Fira Sans', 'Droid Sans', 'Helvetica Neue', sans-serif;
      display: flex;
      flex-direction: column;
      height: 100vh;
      background: #fff;
    }

    #tab-bar {
      display: flex;
      align-items: center;
      background: #131010;
      border-bottom: 1px solid #0b0909;
      height: 40px;
      padding: 0 8px;
      gap: 4px;
      overflow-x: auto;
      user-select: none;
    }

    .tab {
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: #131010;
      border: 1px solid #0b0909;
      border-radius: 4px 4px 0 0;
      padding: 6px 12px;
      min-width: 100px;
      max-width: 250px;
      font-size: 13px;
      cursor: pointer;
      transition: all 0.2s ease;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .tab:hover {
      background: #252525;
    }

    .tab.active {
      background: #000000;
      border-bottom-color: #000;
      font-weight: 500;
    }

    .tab-title {
      flex: 1;
      overflow: hidden;
      text-overflow: ellipsis;
      margin-right: 6px;
      color: #fff;
    }

    .tab-close {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 16px;
      height: 16px;
      border-radius: 2px;
      font-size: 12px;
      opacity: 0.6;
      transition: all 0.2s ease;
      flex-shrink: 0;
    }

    .tab-close:hover {
      opacity: 1;
      background: rgba(0, 0, 0, 0.1);
    }

    #add-tab-btn {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 32px;
      height: 32px;
      background: none;
      border: none;
      border-radius: 4px;
      font-size: 18px;
      cursor: pointer;
      color: #666;
      transition: all 0.2s ease;
      flex-shrink: 0;
    }

    #add-tab-btn:hover {
      background: rgba(0, 0, 0, 0.05);
      color: #000;
    }

    #content-container {
      flex: 1;
      position: relative;
      background: #fff;
    }

    .no-tabs {
      display: flex;
      align-items: center;
      justify-content: center;
      height: 100%;
      color: #999;
      font-size: 14px;
    }
  </style>
</head>
<body>
  <div id="tab-bar">
    <button id="add-tab-btn" title="Add new tab">+</button>
  </div>
  <div id="content-container">
    <div class="no-tabs">Click + to add a new tab</div>
  </div>

  <script>
    let tabs = [];
    let activeTabId = null;
    let nextTabId = 1;
    const TAB_URL = 'https://client.northboundproject.uk/web/';

    const tabBar = document.getElementById('tab-bar');
    const addTabBtn = document.getElementById('add-tab-btn');
    const contentContainer = document.getElementById('content-container');

    addTabBtn.addEventListener('click', () => {
      addTab();
    });

    function addTab() {
      const tabId = nextTabId++;
      const tabData = {
        id: tabId,
        title: 'Loading...',
        url: TAB_URL,
      };
      tabs.push(tabData);
      renderTabs();
      activateTab(tabId);
      window.electronAPI.createTab(tabId, TAB_URL);
    }

    function closeTab(tabId) {
      const index = tabs.findIndex(t => t.id === tabId);
      if (index === -1) return;

      tabs.splice(index, 1);
      window.electronAPI.closeTab(tabId);

      if (activeTabId === tabId) {
        if (tabs.length > 0) {
          const newActiveId = tabs[Math.max(0, index - 1)].id;
          activateTab(newActiveId);
        } else {
          activeTabId = null;
          renderTabs();
          contentContainer.innerHTML = '<div class="no-tabs">Click + to add a new tab</div>';
        }
      } else {
        renderTabs();
      }
    }

    function activateTab(tabId) {
      activeTabId = tabId;
      renderTabs();
      window.electronAPI.showTab(tabId);
    }

    function updateTabTitle(tabId, title) {
      const tab = tabs.find(t => t.id === tabId);
      if (tab) {
        tab.title = title || 'Senza titolo';
        renderTabs();
      }
    }

    function renderTabs() {
      const oldTabs = tabBar.querySelectorAll('.tab');
      oldTabs.forEach(el => el.remove());

      tabs.forEach(tab => {
        const tabEl = document.createElement('div');
        tabEl.className = `tab ${tab.id === activeTabId ? 'active' : ''}`;
        tabEl.innerHTML = `
          <span class="tab-title">${escapeHtml(tab.title)}</span>
          <span class="tab-close">✕</span>
        `;

        tabEl.querySelector('.tab-title').addEventListener('click', (e) => {
          e.stopPropagation();
          activateTab(tab.id);
        });

        tabEl.querySelector('.tab-close').addEventListener('click', (e) => {
          e.stopPropagation();
          closeTab(tab.id);
        });

        tabBar.insertBefore(tabEl, addTabBtn);
      });
    }

    function escapeHtml(text) {
      const div = document.createElement('div');
      div.textContent = text;
      return div.innerHTML;
    }

    window.electronAPI.onTabTitleUpdated((tabId, title) => {
      updateTabTitle(tabId, title);
    });

    // Apri una scheda all'avvio
    window.addEventListener('DOMContentLoaded', () => {
      addTab();
    });
  </script>
</body>
</html>
